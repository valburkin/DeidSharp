# Build, test and check every change. The deterministic layers need nothing but the
# .NET SDK; the integration job also runs the stock Presidio image in Docker. Every
# action is pinned to a commit, with its version in a comment (Dependabot updates both).
name: CI

on:
  push:
    branches: [main]
    # A release tag also checks that docs/evaluation holds the published measurements.
    tags: ["v*"]
  pull_request:
  # Weekly, so a vulnerability published against a pinned package fails the build
  # even when nothing in the repository changed.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request replaces its run; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  # Every restore, implicit ones included, installs exactly what the lock files list.
  RestoreLockedMode: "true"

jobs:
  dotnet:
    name: .NET on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      # Restore installs exactly the lock files' packages and audits every one of them,
      # transitive ones included; a known vulnerability is an error (Directory.Build.props).
      - run: dotnet restore DeidSharp.slnx --locked-mode
      # Analyzers and code style are errors too.
      - run: dotnet build DeidSharp.slnx --configuration Release --no-restore
      # Microsoft.Testing.Platform: no -nologo, which would be passed to the test app.
      - run: dotnet test DeidSharp.slnx --configuration Release --no-build
      # The five packages and their symbols, as a release ships them.
      - run: dotnet pack DeidSharp.slnx --configuration Release --no-build --output artifacts

  # The nursing notes may not leave a credentialed maintainer's machine, so CI cannot
  # measure on them. Results keep the version and commit they were measured at, and a
  # release measures again only when a change could alter what the measured stacks find
  # (D5 in docs/evaluation/findings.md): this job refuses a tag without the published
  # measurements, with results from a later version, or with results whose code changed
  # since they were measured unless findings.md records why they still stand.
  evaluation-results:
    name: Evaluation results published
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history, to compare the tag with each measured commit.
          fetch-depth: 0
      - name: Check docs/evaluation/results.json
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          results=docs/evaluation/results.json
          findings=docs/evaluation/findings.md
          # What the published numbers depend on: the detectors and their packages' locks, the
          # sidecar, the stock Presidio image, and the tool that runs and scores the stacks.
          measured_code=(src sidecar tools/DeidSharp.Evaluation.Cli docker-compose.yml ':!*.md' ':!sidecar/tests')
          # The nursing notes' headline is the held-out half (split "report"); ASQ-PHI has no tuning half, so it is measured whole.
          for want in "physionet-deid report" "asq-phi all"; do
            read -r corpus split <<< "$want"
            if ! jq --exit-status --arg c "$corpus" --arg s "$split" '[.corpora[] | select(.corpus == $c and .scope == "safe-harbor" and .split == $s)] | length == 1' "$results" > /dev/null; then
              echo "$results has no safe-harbor measurement on $corpus, split $split." >&2
              exit 1
            fi
          done
          if ! jq --exit-status 'all(.corpora[]; (.version // "") != "")' "$results" > /dev/null; then
            echo "$results has a measurement without a version." >&2
            exit 1
          fi
          # Release versions carry no suffix; a pre-release is compared by its release part.
          unrecorded=$(jq --raw-output '.corpora[] | [.corpus, .scope, .split, .version, (.commit // "")] | join("\u001f")' "$results" |
            while IFS=$'\x1f' read -r corpus scope split measured commit; do
              name="$corpus/$scope/$split"
              if [ "$(printf '%s\n%s\n' "${measured%%-*}" "${version%%-*}" | sort -V | tail -n 1)" != "${version%%-*}" ]; then
                echo "$name was measured with $measured, a later version than $version." >&2
                exit 1
              fi
              if [[ ! "$commit" =~ ^[0-9a-f]{7,40}$ ]] || ! git cat-file -e "$commit^{commit}" 2> /dev/null; then
                echo "$name (no commit in this history)"
              elif ! git diff --quiet "$commit" HEAD -- "${measured_code[@]}"; then
                echo "$name (measured at ${commit:0:7}; changed since: $(git diff --name-only "$commit" HEAD -- "${measured_code[@]}" | wc -l))"
              fi
            done)
          # A measurement stays the result of record until its code changes what it finds. Whether
          # a change does is the maintainer's call, but it must be written down, so a kept result
          # is never an oversight.
          # The line must be a top-level item of the Releases section, starting "- **v<version>**".
          release_line=$(awk -v want="- **v$version**" '
            /^## Releases$/ { section = 1; next }
            /^## / { section = 0 }
            section && ($0 == want || index($0, want " ") == 1) { found = 1 }
            END { print found + 0 }' "$findings")
          if [ -n "$unrecorded" ] && [ "$release_line" = 0 ]; then
            echo "The measured code changed since these results, or can't be checked, and the Releases section of $findings has no line for v$version saying why they stand:" >&2
            echo "$unrecorded" >&2
            echo "Measure again, or add the line under Releases (docs/evaluation/README.md#before-a-release)." >&2
            exit 1
          fi
          if [ -n "$unrecorded" ]; then
            echo "::notice::Kept results whose code changed, as findings.md records for v$version: $(echo "$unrecorded" | paste -sd ';' -)"
          fi

  integration:
    name: Integration with stock Presidio
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      # The clinical sidecar's image is several GB; its tests stay opt-in (DEIDSHARP_CLINICAL).
      - run: dotnet test --project tests/DeidSharp.IntegrationTests --configuration Release
        env:
          DEIDSHARP_INTEGRATION: "1"

  sidecar:
    name: Clinical sidecar code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Python of sidecar/Dockerfile and sidecar/ruff.toml.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sidecar/tools/requirements.txt
      - run: python -m pip install --requirement sidecar/tools/requirements.txt
      # The image's lock resolves: every package downloads for its Linux target and
      # matches its hash, without building anything from source.
      - name: Image lock
        run: >-
          python -m pip download --no-deps --require-hashes --only-binary=:all:
          --platform manylinux_2_28_x86_64 --platform manylinux_2_17_x86_64 --platform linux_x86_64
          --python-version 3.12 --implementation cp --abi cp312
          --requirement sidecar/requirements.txt --dest "$RUNNER_TEMP/wheels"
      # Known vulnerabilities in the image's lock. torch's CPU build is not on PyPI, where
      # the advisories are, so it is checked by its plain version; the spaCy model, a URL
      # requirement, is not a published package.
      - name: Image lock vulnerabilities
        run: |
          pip-audit --requirement sidecar/requirements.txt --require-hashes --disable-pip --progress-spinner off
          sed -n 's/^torch==\([0-9.]*\).*/torch==\1/p' sidecar/requirements.txt > "$RUNNER_TEMP/torch.txt"
          pip-audit --requirement "$RUNNER_TEMP/torch.txt" --no-deps --disable-pip --progress-spinner off
      # The GPU image's lock, audited the same way (its torch is the release checked above).
      # Its wheels are not downloaded here, CUDA's libraries being several GB; the sidecar's
      # tests prove it pins every other package at the CPU lock's version.
      - name: GPU image lock vulnerabilities
        run: pip-audit --requirement sidecar/requirements-cuda.txt --require-hashes --disable-pip --progress-spinner off
      # The model baselines' image (tools/baselines/models), audited the same way.
      - name: Baseline models lock vulnerabilities
        run: |
          pip-audit --requirement tools/baselines/models/requirements.txt --require-hashes --disable-pip --progress-spinner off
          sed -n 's/^torch==\([0-9.]*\).*/torch==\1/p' tools/baselines/models/requirements.txt > "$RUNNER_TEMP/baseline-torch.txt"
          pip-audit --requirement "$RUNNER_TEMP/baseline-torch.txt" --no-deps --disable-pip --progress-spinner off
      - run: ruff check sidecar tools/baselines
      - run: ruff format --check sidecar tools/baselines
      - run: python -m pytest sidecar/tests tools/baselines/models/tests

  # A release tag that passed every job above is packed here and pushed to nuget.org with
  # Trusted Publishing: GitHub's OIDC token is exchanged for a key that lives an hour, so
  # no API key is stored anywhere. nuget.org can't delete a version, so the "nuget"
  # environment can hold the push for a person's approval (repository settings).
  publish:
    name: Publish to nuget.org
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [dotnet, evaluation-results, integration, sidecar]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore DeidSharp.slnx --locked-mode
      # On GitHub Actions the build is a ContinuousIntegrationBuild (Directory.Build.props).
      - run: dotnet pack DeidSharp.slnx --configuration Release --no-restore --output artifacts
      # A tag must push the version it names, never another one.
      - name: Check the packages' version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test -f "artifacts/DeidSharp.${TAG#v}.nupkg" || { echo "The packages aren't version ${TAG#v}; set it in Directory.Build.props." >&2; exit 1; }
      - name: Log in to nuget.org
        id: nuget
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}
      # Each .nupkg is pushed with its .snupkg.
      - name: Push the packages
        run: dotnet nuget push "artifacts/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" --skip-duplicate
