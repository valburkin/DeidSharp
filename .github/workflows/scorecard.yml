# OpenSSF Scorecard: checks the repository's security practices (pinned dependencies, branch
# protection, token permissions, signed releases and more) and publishes the score the README's
# badge shows. Results also appear under the Security tab. It changes nothing in the repository; it writes only
# its results, to code scanning and to api.scorecard.dev.
name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "15 14 * * 0"
  push:
    branches: [main]

permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event.repository.default_branch == github.ref_name && !github.event.repository.private }}
    permissions:
      # Uploads the results to code scanning.
      security-events: write
      # Signs the results published to api.scorecard.dev, which the badge reads.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
