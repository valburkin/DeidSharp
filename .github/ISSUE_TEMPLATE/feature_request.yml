name: Feature request
description: Something DeidSharp should do that it does not.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What you need, and why
      description: The problem first; a proposed solution is welcome but optional.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
